workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups: [] 
      vars: {} 
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      - name: Setup Java & Gradle Wrapper
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          
          # استخدام الإجراء الرسمي لإنشاء ملفات gradlew المفقودة بأمان تام
          curl -sL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
          /tmp/gradle-dist/bin/gradle wrapper --gradle-version 8.5
          
      - name: Install Dependencies & Build
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - thaer@example.com # ضع بريدك الإلكتروني الحقيقي هنا
