workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups: [] 
      vars: {} 
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # --- الخدعة الذكية: تحميل ملفات Wrapper جاهزة بدلاً من توليدها ---
      - name: Inject Pre-built Gradle Wrapper
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          
          echo "Injecting pre-built Gradle Wrapper files..."
          mkdir -p gradle/wrapper
          
          # تنزيل ملفات الـ Wrapper الجاهزة مباشرة من مصدر موثوق
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradlew -o gradlew
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.jar -o gradle/wrapper/gradle-wrapper.jar
          curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.5.0/gradle/wrapper/gradle-wrapper.properties -o gradle/wrapper/gradle-wrapper.properties
          
          chmod +x gradlew
          
      - name: Install Dependencies & Build
        script: |
          # الآن فقط ننفذ البناء باستخدام الملف الذي حقناه للتو
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - thaer@example.com # ضع بريدك الإلكتروني الحقيقي هنا
