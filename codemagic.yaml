workflows:
  android-workflow:
    name: Build Android APK
    instance_type: mac_mini_m1
    max_build_duration: 60
    environment:
      groups: [] 
      vars: {} 
      flutter: stable
      xcode: latest
      cocoapods: default
    scripts:
      # --- الخطوة السحرية: استخدام إضافة Gradle الرسمية ---
      - name: Setup Java & Generate Missing Wrapper
        script: |
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          
          # نستخدم أمر gradle المتوفر مسبقاُ في بيئة Codemagic الذكية
          # بدلاً من تنزيله يدوياً، نطلب منه توليد ملفات الـ wrapper فقط
          echo "Generating Gradle Wrapper using system-installed Gradle..."
          gradle wrapper --gradle-version 8.5
          
          # التأكد من الصلاحيات بعد الإنشاء
          chmod +x gradlew
          
      - name: Install Dependencies & Build
        script: |
          # الآن فقط ننفذ البناء باستخدام الملف الذي أنشأناه للتو
          ./gradlew assembleDebug --no-daemon --stacktrace
    artifacts:
      - app/build/outputs/apk/debug/*.apk
    publishing:
      email:
        recipients:
          - thaer@example.com # ضع بريدك الإلكتروني الحقيقي هنا
